<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁｜國中會考總複習 物理篇</title><style>
:root{--g:#00954B;--g2:#3CC27A;--dk:#0B5E36;--ink:#1d2a24;--mut:#6b7a72;--bg:#f6faf7;--card:#fff;--ln:#d6eadc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:0 auto;padding:14px 16px 8px;display:flex;gap:12px;align-items:center}
.bar{width:8px;align-self:stretch;border-radius:4px;background:var(--g)}
.hd small{color:var(--g2);font-weight:700;letter-spacing:.04em;font-size:13px}.hd h1{margin:0;font-size:22px;color:var(--dk)}
nav{max-width:860px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
nav a{flex:none;padding:4px 12px;border:1.5px solid var(--g);border-radius:999px;color:var(--g);text-decoration:none;font-size:14px;font-weight:700}
nav a.on{background:var(--g);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
h2{color:#fff;background:var(--dk);display:inline-block;padding:2px 14px;border-radius:6px;font-size:17px;margin:28px 0 10px}
.q,.grp{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin:12px 0}
.grp{background:#eef7f1}
.top{display:flex;justify-content:space-between;align-items:baseline}.no{font-weight:800;color:var(--g);font-size:18px}.src{color:var(--mut);font-size:13px}
.q p{margin:6px 0}.op{list-style:none;padding:0;margin:6px 0}.op li{margin:2px 0}
img{max-width:100%;height:auto;display:block;margin:8px auto}
details{margin-top:8px;border-top:1px dashed var(--ln);padding-top:6px}summary{cursor:pointer;color:var(--g);font-weight:700}
.ans{color:#c00000;font-weight:800}.sol{background:#f3f8f5;border-left:4px solid var(--g2);padding:8px 12px;border-radius:6px;margin-top:6px}
.cards{display:grid;gap:12px}.cards a{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--dk)}
.cards b{font-size:26px;color:var(--g);min-width:48px}.cards span{flex:1;font-weight:700}.cards i{font-style:normal;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 0 40px}
</style>
</head><body><header><div class="hd"><div class="bar"></div><div><small>恩熙老師編著</small><h1>國中會考總複習｜練習題詳解</h1></div></div></header><main><div class="cards"><a href="phy/"><b>物</b><span>物理篇</span><i>›</i></a></div></main><footer>國中會考總複習 物理篇｜恩熙老師編著</footer></body></html>
